services:
  - type: web
    name: remotejobspk
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: NEXT_PUBLIC_SITE_NAME
        value: RemoteJobsPK
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@remotejobspk.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: RUN_SEED
        value: "true"
      # Import runs in background on boot only when the board is thin / missing meta.
      # Set true temporarily if you need a forced full refresh after deploy.
      - key: RUN_IMPORT
        value: "false"
    disk:
      name: remotejobspk-data
      mountPath: /data
      sizeGB: 1
